<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ JOJO'S GACHA BATTLEGROUNDS 2D ⚡</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0; padding: 0; background: #08040d; color: #fff;
      font-family: 'Impact', 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    
    /* INTERFAZ PRINCIPAL */
    #topBar {
      display: flex; gap: 15px; align-items: center; margin-bottom: 10px;
      background: rgba(25, 12, 40, 0.9); padding: 10px 20px; border-radius: 12px;
      border: 2px solid #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      z-index: 5;
    }
    .stat { font-size: 1.2rem; text-shadow: 2px 2px 0 #000; }
    .money { color: #00ff66; }
    .wave { color: #ff0055; }
    
    .btn-ui {
      background: linear-gradient(180deg, #ffd700, #ff8800); border: none;
      color: #000; padding: 8px 16px; font-size: 1rem; font-weight: bold;
      border-radius: 20px; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 0 #b35900;
    }
    .btn-ui:hover { transform: scale(1.05); }
    .btn-ui:active { transform: translateY(3px); box-shadow: 0 1px 0 #b35900; }

    /* CONTENEDOR DEL JUEGO */
    #gameArea { position: relative; border: 4px solid #3d1e6d; border-radius: 10px; overflow: hidden; }
    canvas { display: block; background: #120822; }

    /* OVERLAYS Y MENÚS */
    .modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 10;
    }
    .modal-content {
      background: #1a0c2e; border: 3px solid #ffd700; border-radius: 15px;
      padding: 25px; width: 85%; max-width: 480px; text-align: center;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
    }

    /* RARIDADES */
    .rarity-Comun { color: #aaaaaa; }
    .rarity-PocoComun { color: #00ff66; }
    .rarity-Epico { color: #a335ee; }
    .rarity-Legendario { color: #ff8000; }
    .rarity-Mitico { color: #ff0055; text-shadow: 0 0 10px #ff0055; }

    /* INVENTARIO LIST */
    .inventory-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
      max-height: 200px; overflow-y: auto; margin: 15px 0; padding: 5px;
    }
    .stand-card {
      background: #281343; border: 2px solid #55288c; border-radius: 8px;
      padding: 10px; cursor: pointer; transition: 0.2s;
    }
    .stand-card:hover { border-color: #ffd700; transform: scale(1.02); }
    .stand-card.equipped { border-color: #00ff66; background: #183d25; }

    /* CONTROLES FOOTER */
    .controls {
      margin-top: 10px; font-size: 0.85rem; color: #00f2fe;
      display: flex; gap: 15px; background: rgba(0,0,0,0.5); padding: 6px 15px; border-radius: 20px;
    }
    .key { background: #ffd700; color: #000; padding: 1px 5px; border-radius: 3px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- BARRA DE ESTADÍSTICAS E INTERFAZ -->
  <div id="topBar">
    <div class="stat money">💰 $<span id="moneyTxt">100</span></div>
    <div class="stat wave">🌊 OLEAJE: <span id="waveTxt">1</span></div>
    <button class="btn-ui" onclick="toggleGame()" id="startBtn">▶ INICIAR OLEADA</button>
    <button class="btn-ui" style="background: linear-gradient(180deg, #a335ee, #55288c); color:#fff;" onclick="openShop()">🎰 TIENDA ($50)</button>
    <button class="btn-ui" style="background: linear-gradient(180deg, #00f2fe, #006699); color:#fff;" onclick="openInventory()">🎒 INVENTARIO</button>
  </div>

  <!-- CANVAS PRINCIPAL DE JUEGO -->
  <div id="gameArea">
    <canvas id="canvas" width="800" height="420"></canvas>

    <!-- MODAL TIENDA GACHA -->
    <div class="modal" id="shopModal">
      <div class="modal-content">
        <h2>🎰 TIENDA DE STANDS 🎰</h2>
        <p>Costo por Giro: <b style="color:#00ff
